name: Build Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "预置输入助手" app/main.py
          Copy-Item config.json "dist/预置输入助手/config.json" -Force
          Copy-Item README.md "dist/预置输入助手/README.md" -Force
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/预置输入助手/*" -DestinationPath "预置输入助手-Windows.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 预置输入助手-Windows
          path: 预置输入助手-Windows.zip
